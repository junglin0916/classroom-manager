<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Class Learning Manager</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
</head>
<body class="bg-slate-50">
  <div id="root"></div>

  <script>
    const e = React.createElement;
    const { useState, useEffect, useRef } = React;

    const INITIAL_CLASSES_DATA = {
      'c101': {
        name: 'Class 705',
        groups: [
          { id: 'g1', name: 'Group Alpha', members: [{ id: 's1', seatNo: 1, name: 'Alice', points: 0 }, { id: 's2', seatNo: 2, name: 'Bob', points: 0 }] },
          { id: 'g2', name: 'Group Beta', members: [{ id: 's3', seatNo: 3, name: 'Charlie', points: 0 }] }
        ],
        logs: []
      },
      'c102': { name: 'Class 805', groups: [], logs: [] },
      'c103': { name: 'Class 806', groups: [], logs: [] },
      'c104': { name: 'Class 807', groups: [], logs: [] },
      'c105': { name: 'Class 808', groups: [], logs: [] }
    };

    const INITIAL_CATEGORIES = [
      { id: 'cat1', name: 'Classroom Participation', type: 'good', defaultPoints: 2 },
      { id: 'cat2', name: 'Helping Team Members', type: 'good', defaultPoints: 3 },
      { id: 'cat3', name: 'Class Disruption / Interrupting', type: 'bad', defaultPoints: -2 },
      { id: 'cat4', name: 'Late / Unprepared', type: 'bad', defaultPoints: -1 }
    ];

    function GroupClassroomManager() {
      const MASTER_PASSWORD = "mysecretpassword"; // Set your password here
      const START_HOUR = 8;
      const END_HOUR = 17;

      const [classesData, setClassesData] = useState(() => {
        const saved = localStorage.getItem('GCM_CLASSES_DATA');
        return saved ? JSON.parse(saved) : INITIAL_CLASSES_DATA;
      });

      const [selectedClassId, setSelectedClassId] = useState('c101');

      const [categories, setCategories] = useState(() => {
        const saved = localStorage.getItem('GCM_CATEGORIES');
        return saved ? JSON.parse(saved) : INITIAL_CATEGORIES;
      });

      const [inputPassword, setInputPassword] = useState('');
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [isTimeAllowed, setIsTimeAllowed] = useState(false);
      const [timeStatusMessage, setTimeStatusMessage] = useState('');

      const [newGroupName, setNewGroupName] = useState('');
      const [selectedGroupId, setSelectedGroupId] = useState('');
      const [newSeatNo, setNewSeatNo] = useState('');
      const [newStudentName, setNewStudentName] = useState('');
      const [newCatName, setNewCatName] = useState('');
      const [newCatType, setNewCatType] = useState('good');
      const [newCatPoints, setNewCatPoints] = useState(1);
      const [selectedStudentId, setSelectedStudentId] = useState('');
      const [selectedCatId, setSelectedCatId] = useState('');
      const [logNote, setLogNote] = useState('');

      const [batchNames, setBatchNames] = useState('');
      const [batchCategories, setBatchCategories] = useState('');

      const [isVoiceEnabled, setIsVoiceEnabled] = useState(false);
      const [volumeLevel, setVolumeLevel] = useState(0);
      const noiseThreshold = 60;
      const [isNoiseAlert, setIsNoiseAlert] = useState(false);

      const audioContextRef = useRef(null);
      const micStreamRef = useRef(null);
      const animFrameRef = useRef(null);

      const activeClass = classesData[selectedClassId] || { name: 'Class', groups: [], logs: [] };

      useEffect(() => {
        localStorage.setItem('GCM_CLASSES_DATA', JSON.stringify(classesData));
      }, [classesData]);

      useEffect(() => {
        localStorage.setItem('GCM_CATEGORIES', JSON.stringify(categories));
      }, [categories]);

      useEffect(() => {
        if (activeClass.groups && activeClass.groups.length > 0) {
          setSelectedGroupId(activeClass.groups[0].id);
        } else {
          setSelectedGroupId('');
        }
      }, [selectedClassId]);

      useEffect(() => {
        const checkTimeWindow = () => {
          const now = new Date();
          const day = now.getDay();
          const hour = now.getHours();

          const isWeekday = (day >= 1 && day <= 5);
          const isWithinHours = (hour >= START_HOUR && hour < END_HOUR);

          if (isWeekday && isWithinHours) {
            setIsTimeAllowed(true);
            setTimeStatusMessage('🟢 Editing Window OPEN (Weekdays 08:00 - 17:00)');
          } else {
            setIsTimeAllowed(false);
            setTimeStatusMessage('🔴 Editing Window CLOSED (Mon–Fri 08:00 - 17:00 Only)');
          }
        };

        checkTimeWindow();
        const interval = setInterval(checkTimeWindow, 30000);
        return () => clearInterval(interval);
      }, []);

      const handleLogin = () => {
        if (inputPassword === MASTER_PASSWORD) {
          setIsAuthenticated(true);
        } else {
          alert('Incorrect Password!');
        }
      };

      const canEdit = isAuthenticated && isTimeAllowed;

      useEffect(() => {
        if (isVoiceEnabled) startAudioMonitoring();
        else stopAudioMonitoring();
        return () => stopAudioMonitoring();
      }, [isVoiceEnabled]);

      const startAudioMonitoring = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          micStreamRef.current = stream;
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          const audioCtx = new AudioCtx();
          audioContextRef.current = audioCtx;
          const analyser = audioCtx.createAnalyser();
          analyser.fftSize = 256;
          const source = audioCtx.createMediaStreamSource(stream);
          source.connect(analyser);

          const dataArray = new Uint8Array(analyser.frequencyBinCount);
          const updateVolume = () => {
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            const average = sum / dataArray.length;
            const normalizedVol = Math.min(100, Math.round((average / 128) * 100));
            setVolumeLevel(normalizedVol);
            setIsNoiseAlert(normalizedVol > noiseThreshold);
            animFrameRef.current = requestAnimationFrame(updateVolume);
          };
          updateVolume();
        } catch (err) {
          alert("Microphone permission denied or unsupported.");
          setIsVoiceEnabled(false);
        }
      };

      const stopAudioMonitoring = () => {
        if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
        if (micStreamRef.current) micStreamRef.current.getTracks().forEach(track => track.stop());
        if (audioContextRef.current) audioContextRef.current.close();
        setVolumeLevel(0);
        setIsNoiseAlert(false);
      };

      // --- EDITING & DELETION ACTIONS ---
      const addGroup = () => {
        if (!canEdit) return alert('Editing is disabled!');
        if (!newGroupName.trim()) return;
        const newGroup = { id: 'g_' + Date.now(), name: newGroupName, members: [] };
        setClassesData({
          ...classesData,
          [selectedClassId]: {
            ...activeClass,
            groups: [...activeClass.groups, newGroup]
          }
        });
        setNewGroupName('');
      };

      const deleteGroup = (groupId) => {
        if (!canEdit) return alert('Editing is disabled!');
        if (confirm('Delete this group and all its members?')) {
          const updatedGroups = activeClass.groups.filter(g => g.id !== groupId);
          setClassesData({
            ...classesData,
            [selectedClassId]: { ...activeClass, groups: updatedGroups }
          });
        }
      };

      const addStudent = () => {
        if (!canEdit) return alert('Editing is disabled!');
        if (!newStudentName.trim() || !selectedGroupId) return;
        const seat = newSeatNo ? Number(newSeatNo) : (activeClass.groups.flatMap(g => g.members).length + 1);
        
        const updatedGroups = activeClass.groups.map(g => g.id === selectedGroupId ? {
          ...g, members: [...g.members, { id: 's_' + Date.now(), seatNo: seat, name: newStudentName, points: 0 }]
        } : g);

        setClassesData({
          ...classesData,
          [selectedClassId]: { ...activeClass, groups: updatedGroups }
        });
        setNewStudentName('');
        setNewSeatNo('');
      };

      const deleteStudent = (studentId) => {
        if (!canEdit) return alert('Editing is disabled!');
        const updatedGroups = activeClass.groups.map(g => ({
          ...g,
          members: g.members.filter(s => s.id !== studentId)
        }));
        setClassesData({
          ...classesData,
          [selectedClassId]: { ...activeClass, groups: updatedGroups }
        });
      };

      const addCategory = () => {
        if (!canEdit) return alert('Editing is disabled!');
        if (!newCatName.trim()) return;
        const pts = newCatType === 'bad' ? -Math.abs(Number(newCatPoints)) : Math.abs(Number(newCatPoints));
        setCategories([...categories, { id: 'c_' + Date.now(), name: newCatName, type: newCatType, defaultPoints: pts }]);
        setNewCatName('');
      };

      const deleteCategory = (catId) => {
        if (!canEdit) return alert('Editing is disabled!');
        setCategories(categories.filter(c => c.id !== catId));
      };

      const handleFastPasteStudents = () => {
        if (!canEdit) return alert('Editing is disabled!');
        if (!batchNames.trim() || !selectedGroupId) return;
        const lines = batchNames.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        
        // Existing student count for seat auto-numbering
        const totalExisting = activeClass.groups.flatMap(g => g.members).length;

        const newMembers = lines.map((line, index) => {
          // Check if line starts with a number (e.g., "1 Alice" or "01, Alice")
          const match = line.match(/^(\d+)[\s,.-]+(.+)/);
          let seatNo = totalExisting + index + 1;
          let name = line;

          if (match) {
            seatNo = Number(match[1]);
            name = match[2].trim();
          }

          return {
            id: 's_' + Date.now() + '_' + index,
            seatNo: seatNo,
            name: name,
            points: 0
          };
        });

        const updatedGroups = activeClass.groups.map(g => g.id === selectedGroupId ? {
          ...g, members: [...g.members, ...newMembers]
        } : g);

        setClassesData({
          ...classesData,
          [selectedClassId]: { ...activeClass, groups: updatedGroups }
        });
        setBatchNames('');
      };

      const handleFastPasteCategories = () => {
        if (!canEdit) return alert('Editing is disabled!');
        if (!batchCategories.trim()) return;
        const lines = batchCategories.split('\n').map(line => line.trim()).filter(line => line.length > 0);
        const newCats = [];
        lines.forEach((line, idx) => {
          const parts = line.split(',').map(p => p.trim());
          const name = parts[0];
          const type = parts[1] && parts[1].toLowerCase() === 'bad' ? 'bad' : 'good';
          let points = parts[2] ? Number(parts[2]) : (type === 'good' ? 1 : -1);
          if (type === 'bad' && points > 0) points = -points;
          if (type === 'good' && points < 0) points = Math.abs(points);
          if (name) newCats.push({ id: 'c_' + Date.now() + '_' + idx, name, type, defaultPoints: points });
        });
        setCategories([...categories, ...newCats]);
        setBatchCategories('');
      };

      const applyBehavior = () => {
        if (!canEdit) return alert('Editing is disabled!');
        if (!selectedStudentId || !selectedCatId) return;
        const cat = categories.find(c => c.id === selectedCatId);
        let targetStudentInfo = '';

        const updatedGroups = activeClass.groups.map(g => ({
          ...g,
          members: g.members.map(s => {
            if (s.id === selectedStudentId) {
              targetStudentInfo = `[#${s.seatNo}] ${s.name}`;
              return { ...s, points: s.points + cat.defaultPoints };
            }
            return s;
          })
        }));

        const newLog = {
          id: Date.now(),
          studentName: targetStudentInfo,
          categoryName: cat.name,
          points: cat.defaultPoints,
          type: cat.type,
          note: logNote,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setClassesData({
          ...classesData,
          [selectedClassId]: {
            ...activeClass,
            groups: updatedGroups,
            logs: [newLog, ...(activeClass.logs || [])]
          }
        });
        setLogNote('');
      };

      return e('div', { className: 'min-h-screen p-6 text-slate-800' },
        e('header', { className: 'bg-white rounded-xl shadow-sm p-6 mb-4 border border-slate-200 flex justify-between items-center flex-wrap gap-4' },
          e('div', { className: 'flex items-center gap-4' },
            e('div', null,
              e('label', { className: 'text-xs font-bold text-slate-400 uppercase tracking-wider block' }, 'Active Class'),
              e('select', {
                value: selectedClassId,
                onChange: (ev) => setSelectedClassId(ev.target.value),
                className: 'text-xl font-bold bg-slate-100 text-indigo-900 border border-slate-300 rounded-lg px-3 py-1.5 mt-0.5 focus:ring-2 focus:ring-indigo-500'
              }, Object.keys(classesData).map(cid => e('option', { key: cid, value: cid }, classesData[cid].name)))
            )
          ),
          e('div', { className: 'flex items-center gap-4 bg-slate-100 p-3 rounded-lg border border-slate-200' },
            e('span', { className: 'text-sm font-semibold' }, 'Noise Detector'),
            e('label', { className: 'relative inline-flex items-center cursor-pointer' },
              e('input', { type: 'checkbox', checked: isVoiceEnabled, onChange: (ev) => setIsVoiceEnabled(ev.target.checked), className: 'sr-only peer' }),
              e('div', { className: "w-11 h-6 bg-slate-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600" })
            ),
            isVoiceEnabled && e('div', { className: 'flex items-center gap-2 pl-2 border-l border-slate-300' },
              e('div', { className: 'w-20 bg-slate-200 h-3 rounded-full overflow-hidden' },
                e('div', { className: 'h-full ' + (isNoiseAlert ? 'bg-red-500' : 'bg-emerald-500'), style: { width: volumeLevel + '%' } })
              ),
              e('span', { className: 'text-xs font-bold px-2 py-0.5 rounded ' + (isNoiseAlert ? 'bg-red-100 text-red-700 animate-bounce' : 'text-slate-600') },
                isNoiseAlert ? 'TOO NOISY!' : volumeLevel + '%'
              )
            )
          )
        ),

        e('div', { className: 'bg-slate-900 text-white rounded-xl p-4 mb-6 shadow-md flex justify-between items-center flex-wrap gap-4' },
          e('div', { className: 'text-xs font-mono' },
            e('p', { className: 'font-bold' }, timeStatusMessage),
            e('p', { className: 'text-slate-400 mt-0.5' }, 'Status: ' + (canEdit ? '🔓 FULL EDITING ACCESS ACTIVE' : '🔒 VIEW-ONLY MODE'))
          ),
          !isAuthenticated ? e('div', { className: 'flex gap-2' },
            e('input', {
              type: 'password',
              placeholder: 'Teacher Password',
              value: inputPassword,
              onChange: (ev) => setInputPassword(ev.target.value),
              className: 'px-3 py-1.5 rounded text-xs text-slate-900 focus:outline-none'
            }),
            e('button', { onClick: handleLogin, className: 'bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded text-xs font-semibold' }, 'Unlock')
          ) : e('button', { onClick: () => setIsAuthenticated(false), className: 'bg-rose-600 hover:bg-rose-500 text-white px-3 py-1.5 rounded text-xs font-semibold' }, 'Lock App')
        ),

        e('section', { className: 'bg-indigo-50 border border-indigo-100 rounded-xl p-5 mb-6 ' + (!canEdit ? 'opacity-60 pointer-events-none' : '') },
          e('h2', { className: 'text-md font-bold text-indigo-900 mb-3' }, '⚡ Fast Paste / Batch Import (' + activeClass.name + ')'),
          e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
            e('div', { className: 'bg-white p-4 rounded-lg border border-indigo-100 shadow-sm space-y-2' },
              e('label', { className: 'text-xs font-bold text-slate-700 block' }, 'Fast Paste Students (Accepts: "Alice" or "01 Alice")'),
              e('div', { className: 'flex gap-2' },
                e('span', { className: 'text-xs text-slate-500 self-center' }, 'Target Group:'),
                e('select', { value: selectedGroupId, onChange: (ev) => setSelectedGroupId(ev.target.value), className: 'border rounded px-2 py-1 text-xs bg-white' },
                  activeClass.groups.map(g => e('option', { key: g.id, value: g.id }, g.name))
                )
              ),
              e('textarea', { rows: '3', placeholder: '01 Alice\n02 Bob\n03 Charlie', value: batchNames, onChange: (ev) => setBatchNames(ev.target.value), className: 'w-full border rounded p-2 text-xs focus:ring-1 focus:ring-indigo-500' }),
              e('button', { onClick: handleFastPasteStudents, disabled: !canEdit || activeClass.groups.length === 0, className: 'w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold py-1.5 rounded disabled:bg-slate-400' }, 'Import All Students')
            ),
            e('div', { className: 'bg-white p-4 rounded-lg border border-indigo-100 shadow-sm space-y-2' },
              e('label', { className: 'text-xs font-bold text-slate-700 block' }, 'Fast Paste Categories (Format: Name, type, points)'),
              e('textarea', { rows: '4', placeholder: 'Active Listening, good, 2\nInterrupting Class, bad, -2', value: batchCategories, onChange: (ev) => setBatchCategories(ev.target.value), className: 'w-full border rounded p-2 text-xs focus:ring-1 focus:ring-indigo-500' }),
              e('button', { onClick: handleFastPasteCategories, disabled: !canEdit, className: 'w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold py-1.5 rounded disabled:bg-slate-400' }, 'Import All Categories')
            )
          )
        ),

        e('div', { className: 'grid grid-cols-1 lg:grid-cols-3 gap-6' },
          e('div', { className: 'space-y-6' },
            e('div', { className: 'bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4 ' + (!canEdit ? 'opacity-60' : '') },
              e('h2', { className: 'text-lg font-bold' }, 'Manage Groups (' + activeClass.name + ')'),
              e('div', { className: 'flex gap-2' },
                e('input', { type: 'text', placeholder: 'New Group Name...', value: newGroupName, onChange: (ev) => setNewGroupName(ev.target.value), className: 'flex-1 px-3 py-2 border rounded-lg text-sm' }),
                e('button', { onClick: addGroup, disabled: !canEdit, className: 'bg-indigo-600 text-white px-3 py-2 rounded-lg text-sm disabled:bg-slate-400' }, '+ Group')
              ),
              e('div', { className: 'flex gap-2' },
                e('select', { value: selectedGroupId, onChange: (ev) => setSelectedGroupId(ev.target.value), className: 'border rounded-lg px-2 py-2 text-sm bg-white' },
                  activeClass.groups.map(g => e('option', { key: g.id, value: g.id }, g.name))
                ),
                e('input', { type: 'number', placeholder: 'Seat #', value: newSeatNo, onChange: (ev) => setNewSeatNo(ev.target.value), className: 'w-20 px-2 py-2 border rounded-lg text-sm' }),
                e('input', { type: 'text', placeholder: 'Student Name...', value: newStudentName, onChange: (ev) => setNewStudentName(ev.target.value), className: 'flex-1 px-3 py-2 border rounded-lg text-sm' }),
                e('button', { onClick: addStudent, disabled: !canEdit || activeClass.groups.length === 0, className: 'bg-slate-800 text-white px-3 py-2 rounded-lg text-sm disabled:bg-slate-400' }, '+ Student')
              )
            ),

            activeClass.groups.map(group => e('div', { key: group.id, className: 'bg-white rounded-xl border border-slate-200 p-4 shadow-sm' },
              e('h3', { className: 'font-bold border-b pb-2 mb-3 flex justify-between items-center' },
                e('span', null, group.name),
                e('div', { className: 'flex items-center gap-2' },
                  e('span', { className: 'text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded-full' }, group.members.length + ' Members'),
                  canEdit && e('button', { onClick: () => deleteGroup(group.id), className: 'text-xs text-rose-500 hover:text-rose-700 font-bold px-1' }, '✕ Delete')
                )
              ),
              e('div', { className: 'space-y-2' },
                group.members.map(s => e('div', { key: s.id, className: 'flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border border-slate-100' },
                  e('span', { className: 'font-medium text-sm' }, `#${s.seatNo} ${s.name}`),
                  e('div', { className: 'flex items-center gap-2' },
                    e('span', { className: 'text-sm font-bold px-2 py-0.5 rounded ' + (s.points >= 0 ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700') },
                      s.points > 0 ? '+' + s.points : s.points, ' pts'
                    ),
                    canEdit && e('button', { onClick: () => deleteStudent(s.id), className: 'text-xs text-slate-400 hover:text-rose-600 px-1' }, '✕')
                  )
                ))
              )
            ))
          ),

          e('div', { className: 'space-y-6' },
            e('div', { className: 'bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4 ' + (!canEdit ? 'opacity-60' : '') },
              e('h2', { className: 'text-lg font-bold' }, 'Log Behavior / Points'),
              e('div', null,
                e('label', { className: 'text-xs font-semibold text-slate-500 uppercase' }, 'Select Student (' + activeClass.name + ')'),
                e('select', { value: selectedStudentId, onChange: (ev) => setSelectedStudentId(ev.target.value), className: 'w-full mt-1 border rounded-lg p-2 text-sm bg-white' },
                  e('option', { value: '' }, '-- Choose Student --'),
                  activeClass.groups.flatMap(g => g.members).map(s => e('option', { key: s.id, value: s.id }, `#${s.seatNo} ${s.name}`))
                )
              ),
              e('div', null,
                e('label', { className: 'text-xs font-semibold text-slate-500 uppercase' }, 'Behavior Category'),
                e('select', { value: selectedCatId, onChange: (ev) => setSelectedCatId(ev.target.value), className: 'w-full mt-1 border rounded-lg p-2 text-sm bg-white' },
                  e('option', { value: '' }, '-- Select Category --'),
                  categories.map(c => e('option', { key: c.id, value: c.id }, '[' + c.type.toUpperCase() + '] ' + c.name + ' (' + (c.defaultPoints > 0 ? '+' + c.defaultPoints : c.defaultPoints) + ' pts)'))
                )
              ),
              e('div', null,
                e('label', { className: 'text-xs font-semibold text-slate-500 uppercase' }, 'Suggestion / Notes'),
                e('textarea', { rows: '2', placeholder: 'e.g., Interrupting group discussion...', value: logNote, onChange: (ev) => setLogNote(ev.target.value), className: 'w-full mt-1 border rounded-lg p-2 text-sm' })
              ),
              e('button', { onClick: applyBehavior, disabled: !canEdit, className: 'w-full bg-indigo-600 text-white font-medium py-2 rounded-lg text-sm disabled:bg-slate-400' }, 'Submit Behavior Entry')
            ),

            e('div', { className: 'bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4 ' + (!canEdit ? 'opacity-60' : '') },
              e('h2', { className: 'text-lg font-bold' }, 'Behavior Categories'),
              e('div', { className: 'space-y-2 mb-3' },
                categories.map(c => e('div', { key: c.id, className: 'flex justify-between items-center text-xs bg-slate-50 p-2 rounded border' },
                  e('span', null, `[${c.type.toUpperCase()}] ${c.name} (${c.defaultPoints > 0 ? '+' + c.defaultPoints : c.defaultPoints} pts)`),
                  canEdit && e('button', { onClick: () => deleteCategory(c.id), className: 'text-rose-500 hover:text-rose-700 font-bold px-1' }, '✕')
                ))
              ),
              e('div', { className: 'grid grid-cols-2 gap-2 border-t pt-3' },
                e('input', { type: 'text', placeholder: 'Category Name', value: newCatName, onChange: (ev) => setNewCatName(ev.target.value), className: 'col-span-2 border rounded-lg p-2 text-sm' }),
                e('select', { value: newCatType, onChange: (ev) => setNewCatType(ev.target.value), className: 'border rounded-lg p-2 text-sm bg-white' },
                  e('option', { value: 'good' }, 'Good (Reward)'),
                  e('option', { value: 'bad' }, 'Bad (Punishment)')
                ),
                e('input', { type: 'number', placeholder: 'Points', value: newCatPoints, onChange: (ev) => setNewCatPoints(ev.target.value), className: 'border rounded-lg p-2 text-sm' })
              ),
              e('button', { onClick: addCategory, disabled: !canEdit, className: 'w-full bg-slate-800 text-white text-sm py-2 rounded-lg disabled:bg-slate-400' }, 'Add Category')
            )
          ),

          e('div', { className: 'bg-white p-5 rounded-xl border border-slate-200 shadow-sm h-fit' },
            e('h2', { className: 'text-lg font-bold mb-4' }, 'Activity Log (' + activeClass.name + ')'),
            e('div', { className: 'space-y-3 max-h-[500px] overflow-y-auto' },
              (activeClass.logs || []).map(log => e('div', { key: log.id, className: 'p-3 border rounded-lg bg-slate-50 text-sm space-y-1' },
                e('div', { className: 'flex justify-between items-center' },
                  e('span', { className: 'font-bold' }, log.studentName),
                  e('span', { className: 'text-xs text-slate-400' }, log.timestamp)
                ),
                e('div', { className: 'flex justify-between items-center' },
                  e('span', { className: 'text-slate-600' }, log.categoryName),
                  e('span', { className: 'font-bold ' + (log.type === 'good' ? 'text-emerald-600' : 'text-rose-600') },
                    log.points > 0 ? '+' + log.points : log.points, ' pts'
                  )
                ),
                log.note && e('p', { className: 'text-xs text-slate-500 italic bg-white p-1.5 rounded border border-slate-100' }, log.note)
              )),
              (!activeClass.logs || activeClass.logs.length === 0) && e('p', { className: 'text-sm text-slate-400 text-center py-6' }, 'No behavioral logs recorded for ' + activeClass.name + ' yet.')
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(e(GroupClassroomManager));
  </script>
</body>
</html>
